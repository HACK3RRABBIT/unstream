[project]
name = "unstream-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    # Installs as a yt-dlp plugin: it needs no import, and does nothing until
    # POT_PROVIDER_URL names a provider for it to ask. See app/ytdlp.py.
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "fastapi>=0.139.0",
    "mutagen>=1.48.1",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
]
