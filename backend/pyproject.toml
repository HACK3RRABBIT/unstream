[project]
name = "unstream-api"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    # Installs as a yt-dlp plugin: it needs no import, and does nothing until
    # POT_PROVIDER_URL names a provider for it to ask. See app/ytdlp.py.
    "bgutil-ytdlp-pot-provider>=1.3.2",
    # The CA bundle the frozen desktop sidecar verifies HTTPS with — see
    # _ensure_ca_bundle() in app/net.py.
    "certifi>=2026.7.22",
    "fastapi>=0.139.0",
    "httpx[socks]>=0.28",
    # Torrent engine for Nyaa. No wheel exists for Windows on ARM or for Intel
    # macOS before 15 (the desktop builds those on runners that would have to
    # compile it from source); those builds bundle aria2c instead, or run
    # without torrents.
    "libtorrent>=2.0.11; python_version < '3.14' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "mutagen>=1.48.1",
    "pycryptodome>=3.20",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pillow>=12.3.0",
    "pyinstaller>=6.22.2",
    "pytest>=8.4.2",
]
