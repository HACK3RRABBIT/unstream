# Prebuilt images, so nobody has to build this to run it.
#
# Both images are awkward to build on the machines people self-host on: the
# api downloads a deno release and resolves a Python lockfile, the frontend
# runs a Vite build. On a Raspberry Pi or a NAS that is the difference
# between "docker compose up" and an afternoon.
#
# Each architecture is built on a runner of that architecture rather than
# under QEMU — emulated arm64 npm and uv are slow enough to matter for a
# weekly rebuild. The per-arch builds push by digest only; the merge job at
# the end is what creates the tags people actually pull.
#
# Two things this file cannot do for itself, both one-time:
#
#  * `ubuntu-24.04-arm` runners are free on public repositories. While this
#    repo is private the arm64 half of the matrix is billable, so either make
#    the repo public first or expect a bill for it.
#  * A package pushed by GITHUB_TOKEN is created **private**, whatever the
#    repository's visibility. Nobody can pull it until someone opens the
#    package on GitHub once and sets its visibility to public — until then
#    `docker compose up` silently falls back to building from source, which
#    looks exactly like this workflow never having run.

name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # yt-dlp's YouTube workarounds ship *in* yt-dlp releases, so an image that
  # is never rebuilt is a workaround frozen at build time. Weekly is roughly
  # the rate at which that matters.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, context: ./backend }
          - { name: frontend, context: ./frontend }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          # No tags here on purpose. Two architectures pushing the same tag
          # would race, and the loser would silently win: the tag would point
          # at one arch instead of at a manifest listing both.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/unstream-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Save the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The filename is the bare digest; the merge job globs these back
          # into one imagetools invocation.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/unstream-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.REGISTRY }}/${{ github.repository_owner }}/unstream-${{ matrix.image }}@sha256:%s " *)
