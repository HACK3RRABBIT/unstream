services:
  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - api
    networks:
      - unstream
      # Traefik (Dokploy's proxy) reaches the container over this network;
      # the domain itself is configured in Dokploy's Domains tab.
      - dokploy-network
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Mints the proof-of-origin tokens YouTube asks datacenter IPs for. Free,
  # keyless, and stateless — it talks to Google on its own and holds nothing
  # worth persisting, so it gets no volume and is safe to recreate at will.
  # Never published to a port: only `api` on the internal network calls it.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: always
    networks:
      - unstream
    logging: *logging

  api:
    build: ./backend
    restart: always
    # Not exposed publicly — only reachable through the frontend nginx proxy
    depends_on:
      - pot-provider
    environment:
      # How long finished downloads stay on disk before the sweeper deletes them.
      - DOWNLOADS_TTL_HOURS=${DOWNLOADS_TTL_HOURS:-24}
      # The hard ceiling the TTL alone does not give you: over this, the
      # sweeper evicts finished jobs oldest-first. Keep it under whatever the
      # host actually has free.
      - MAX_DOWNLOADS_GB=${MAX_DOWNLOADS_GB:-20}
      # Lets yt-dlp fetch the JS challenge solver it needs to turn a format
      # into a URL. Without this it has a runtime and nothing to run in it,
      # and YouTube hands back videos with no audio streams on them. Set to
      # an empty string to refuse the runtime download and accept that.
      - YTDLP_REMOTE_COMPONENTS=${YTDLP_REMOTE_COMPONENTS-ejs:github}
      # Keeps that solver and the player caches across restarts.
      - YTDLP_CACHE_DIR=/app/cache
      # The sidecar above. Unset it to turn tokens off and go back to plain
      # anonymous extraction — which is what a local checkout does, since
      # nothing is listening on this name outside compose.
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-http://pot-provider:4416}
      # The fallback for when tokens alone don't satisfy YouTube. Point it at
      # the file mounted below; an unset or missing path is ignored. Use a
      # throwaway Google account — this account carries every download the
      # server makes, and YouTube bans accounts for that.
      - YTDLP_COOKIEFILE=${YTDLP_COOKIEFILE:-}
      # Unset (the default) means /admin returns 503 and the dashboard does
      # not exist. Set it to a long random string to turn analytics on.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Which day an event is counted in. 0 = UTC; 210 = Tehran, so "today"
      # on the dashboard matches today here.
      - ANALYTICS_UTC_OFFSET_MINUTES=${ANALYTICS_UTC_OFFSET_MINUTES:-210}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
    volumes:
      - downloads:/app/downloads
      # Separate from downloads: that volume is disposable, this one is the
      # only copy of the history and must survive a redeploy.
      - analytics:/app/data
      # The JS challenge solver yt-dlp downloads on first use, kept so it is
      # fetched once rather than after every restart.
      - ytdlp-cache:/app/cache
      # Uncomment together with YTDLP_COOKIEFILE=/app/cookies.txt above —
      # the variable without the mount is the failure this project has
      # already had once, and /api/admin/extraction is what names it.
      #
      # The path is Dokploy's: a File Mount there writes its content to a
      # `files` directory beside the checkout and leaves it alone on every
      # later deploy, which is the property that matters. A cookie committed
      # to the repo instead would be reverted to the committed copy each
      # time Dokploy pulls, quietly undoing the rotation below — and would
      # outlive any decision to make this repo public. Locally, point it at
      # ./cookies.txt instead.
      #
      # Read-write on purpose: YouTube rotates these cookies as they are
      # used and yt-dlp writes the new ones back, so :ro would let the
      # session decay to nothing over a few days.
      # - ../files/cookies.txt:/app/cookies.txt
    networks:
      - unstream
    logging: *logging

networks:
  unstream:
  dokploy-network:
    external: true

volumes:
  downloads:
  analytics:
  ytdlp-cache:
