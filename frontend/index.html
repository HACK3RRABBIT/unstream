<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Unstream — دانلود پلی‌لیست و آلبوم به‌صورت MP3 تگ‌خورده</title>
    <meta
      name="description"
      content="آهنگ، آلبوم و پلی‌لیست جستجو کن — یا لینک اسپاتیفای / دیزر رو پیست کن — Unstream همه رو به‌صورت فایل MP3 تمیز و تگ‌خورده با کاور دانلود می‌کنه."
    />
    <meta name="theme-color" content="#0b0d0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unstream" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter. When deploying, replace the og:url and og:image
         values with absolute URLs on your domain — scrapers need them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unstream" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="Unstream — کتابخونه‌ی موزیکت، به‌شکل فایل" />
    <meta
      property="og:description"
      content="جستجو کن یا لینک اسپاتیفای / دیزر رو بذار و آهنگ، آلبوم و پلی‌لیست رو به‌صورت MP3 تگ‌خورده دانلود کن."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unstream — کتابخونه‌ی موزیکت، به‌شکل فایل" />
    <meta
      name="twitter:description"
      content="جستجو کن یا لینک اسپاتیفای / دیزر رو بذار و آهنگ، آلبوم و پلی‌لیست رو به‌صورت MP3 تگ‌خورده دانلود کن."
    />
    <meta name="twitter:image" content="/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Unstream",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "inLanguage": "fa",
        "description": "آهنگ، آلبوم و پلی‌لیست را جستجو کنید — یا لینک اسپاتیفای / دیزر را وارد کنید — و به‌صورت فایل‌های MP3 تگ‌خورده دانلود کنید.",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>

    <!-- Self-hosted Peyda (docs/adr/0002): preload exactly the weights the UI
         uses. hrefs must match the url()s in index.css byte-for-byte, and font
         preloads need crossorigin even same-origin, or they download twice. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/PeydaFaNumWeb-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/PeydaFaNumWeb-Medium.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/PeydaFaNumWeb-SemiBold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/PeydaFaNumWeb-Bold.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
