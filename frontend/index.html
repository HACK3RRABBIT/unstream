<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint behind the notch and the home
         indicator, which is what an installed PWA should look like. It also
         makes env(safe-area-inset-*) report real values — everything pinned
         to an edge (the dock FAB, toasts, the footer) pads itself with them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>دانلود موزیک، آلبوم و پلی‌لیست از اسپاتیفای و یوتیوب | آنستریم</title>
    <meta
      name="description"
      content="لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت."
    />
    <meta name="theme-color" content="#0b0d0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="آنستریم" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter. When deploying, replace the og:url and og:image
         values with absolute URLs on your domain — scrapers need them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="آنستریم" />
    <meta property="og:locale" content="fa_IR" />
    <meta
      property="og:title"
      content="دانلود موزیک، آلبوم و پلی‌لیست از اسپاتیفای و یوتیوب | آنستریم"
    />
    <meta
      property="og:description"
      content="لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="دانلود موزیک، آلبوم و پلی‌لیست از اسپاتیفای و یوتیوب | آنستریم"
    />
    <meta
      name="twitter:description"
      content="لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت."
    />
    <meta name="twitter:image" content="/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "آنستریم",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "inLanguage": "fa",
        "description": "لینک اسپاتیفای، یوتیوب، ساندکلاد یا دیزر را وارد کنید یا جستجو کنید و موزیک، آلبوم و پلی‌لیست را به‌صورت فایل MP3 تگ‌خورده با کیفیت ۳۲۰ دانلود کنید — رایگان و بدون اکانت.",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>

    <!-- Self-hosted Vazirmatn FD (docs/DESIGN.md): preload exactly the weights the UI
         uses. hrefs must match the url()s in index.css byte-for-byte, and font
         preloads need crossorigin even same-origin, or they download twice. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-FD-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-FD-Medium.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-FD-SemiBold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Vazirmatn-FD-Bold.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
