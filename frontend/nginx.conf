server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API — proxied to the backend over the compose network (same origin,
    # so no CORS and no second domain needed)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ZIPs of long playlists can take a while to stream
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # Hashed build assets — cache forever
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted fonts. Not content-hashed, but they never change — if a
    # font is ever swapped, rename the file.
    location /fonts/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. Everything here (index.html, sw.js, manifest, icons) is
    # small and must revalidate, so a new release reaches installed PWAs on
    # the very next load — the service worker relies on this for updates.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
